# 열처리 공정 최적화 AX - 전체 서비스 (PostgreSQL · Kafka · 이후 Spark · Flink 추가)
# 한 DB 안에서 스키마로 영역 분리: mes(원본) / lake(정제) / mart(분석·학습)
name: aiax-db

services:
  postgres:
    image: postgres:18.6
    container_name: aiax-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    # A 방식(각자 로컬): POSTGRES_BIND_IP=127.0.0.1  → 내 PC에서만 접속
    # B 방식(내 PC가 서버): POSTGRES_BIND_IP=0.0.0.0 → 같은 네트워크 팀원 접속 허용
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18부터 데이터가 /var/lib/postgresql/18/docker 에 저장되므로 상위 폴더를 연결
      - pgdata:/var/lib/postgresql
      # 볼륨이 비어 있을 때(최초 1회)만 이름순으로 자동 실행
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./tests:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Kafka 3.9.2 (KRaft 단독 실행, ZooKeeper 없음) - Kafka UI 버전 인식·도구 호환성 때문에 3.x 마지막 버전 사용 ----------
  # 컨테이너끼리: kafka:9092 / 내 PC에서: localhost:9094
  kafka:
    image: apache/kafka:3.9.2
    container_name: aiax-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    # 개발 단계: 컨테이너를 지우면 토픽·메시지도 사라짐 (보관 필요 시 볼륨 추가)

  # Kafka 관리 화면: http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: aiax-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aiax
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # ---------- Spark (master 1 + worker 1) ----------
  # 관리 화면: http://localhost:8090 / 작업 제출: spark://spark-master:7077
  # 작업 파일은 D:\db\spark\jobs 에 두면 컨테이너의 /opt/spark/jobs 로 보임
  spark-master:
    image: apache/spark:4.2.1-python3
    container_name: aiax-spark-master
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8090:8080"
      - "7077:7077"
    volumes:
      - ./spark/jobs:/opt/spark/jobs

  spark-worker:
    image: apache/spark:4.2.1-python3
    container_name: aiax-spark-worker
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
      - ./spark/jobs:/opt/spark/jobs
    depends_on:
      - spark-master

  # ---------- Flink (팀용 이미지 + jobmanager 1 + taskmanager 1) ----------
  # 관리 화면: http://localhost:8081 / 작업 파일은 D:\db\flink\jobs → 컨테이너 /opt/flink/jobs
  flink-jobmanager:
    build: ./flink
    image: aiax-flink:2.2.1
    container_name: aiax-flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        python.executable: /opt/pyflink/bin/python
        python.client.executable: /opt/pyflink/bin/python
    volumes:
      - ./flink/jobs:/opt/flink/jobs

  flink-taskmanager:
    image: aiax-flink:2.2.1
    container_name: aiax-flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        python.executable: /opt/pyflink/bin/python
    volumes:
      - ./flink/jobs:/opt/flink/jobs
    depends_on:
      - flink-jobmanager

volumes:
  pgdata:
