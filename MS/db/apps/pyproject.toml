[project]
name = "apps"
version = "0.1.0"
description = "주조(다이캐스팅) 공정 최적화 AX - Data Producing·AI 학습·Inference·공정제어 앱 (MS/db 인프라 사용)"
readme = "README.md"
authors = [
    { name = "red-straw", email = "144910907+red-straw@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.16.1",
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.7",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
apps = "apps:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
# 보호구 게이트 판정 (apps.gate_judge) 전용 — 필요할 때만: uv run --group gate python -m apps.gate_judge --gate a
gate = [
    "ultralytics>=8.4.215",
    "opencv-python>=4.10",
    "torch>=2.14",
    "torchvision>=0.29",
]

# torch 는 NVIDIA GPU(CUDA 12.6)판으로 받음 (D:\cas_image 에서 쓰던 것과 같은 판)
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
