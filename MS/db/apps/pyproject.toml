[project]
name = "apps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "red-straw", email = "144910907+red-straw@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.16.1",
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.7",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
apps = "apps:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
