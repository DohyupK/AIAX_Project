[project]
name = "jh-api"
version = "0.1.0"
description = "JH API 서버 (FastAPI) — 인사 관리 등. 실행: uv run uvicorn main:app --host 127.0.0.1 --port 8000"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "numpy==2.5.4",
    "onnxruntime==1.32.0",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.7",
    "scipy==1.18.1",
    "uvicorn[standard]==0.54.0",
    "xgboost-cpu==3.4.1",
]
